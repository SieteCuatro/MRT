[package]
name = "mrt-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mrt-core = { path = "../mrt-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
# API keys in the OS keyring: Windows Credential Manager, the macOS Keychain, or the
# Secret Service over zbus (pure Rust, no libdbus) on Linux.
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native", "async-secret-service", "tokio", "crypto-rust"] }
