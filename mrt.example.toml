# Modern Rust Terminal (MRT) Configuration Example
# 100% Free for All — No Restrictions.
# Note: TOML config loading (~/.config/mrt/config.toml or .mrt.toml) is a planned
# reference schema; MRT currently reads settings from environment variables and GUI controls.

[terminal]
default_shell = "auto" # "auto", "pwsh", "powershell", "cmd", "bash", "git-bash", "wsl", "zsh", "fish", "nu", "sh"
font_size = 14.0
scrollback_blocks = 500
auto_detect_structured_output = true

[safety]
enabled = true
require_approval_for_moderate = false
require_approval_for_critical = true
blocked_patterns = [
    "rm -rf /",
    "format c:",
]

[ai]
# MRT supports ALL AI providers! Set any of these environment variables:
# - GEMINI_API_KEY       (Google Gemini)
# - ANTHROPIC_API_KEY    (Anthropic Claude)
# - OPENAI_API_KEY       (OpenAI)
# - XAI_API_KEY          (xAI Grok)
# - DEEPSEEK_API_KEY     (DeepSeek)
# - OPENROUTER_API_KEY   (OpenRouter — access 200+ models)
# - OLLAMA_MODEL         (Local free models via Ollama, e.g., "qwen2.5-coder" or "llama3.2")
provider = "auto"
ollama_endpoint = "http://localhost:11434"

[[mcp.servers]]
name = "filesystem"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
enabled = false

[[mcp.servers]]
name = "mrt-loopback"
transport = "stdio"
command = "mrt"
args = ["--mcp-server"]
enabled = true
