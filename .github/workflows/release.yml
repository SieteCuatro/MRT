name: Release Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: mrt.exe
            archive_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: mrt
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: mrt
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: mrt
            archive_ext: tar.gz

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libasound2-dev libudev-dev

      - name: Install Zig and cargo-zigbuild (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      # Linux: linked against glibc 2.17 so the binary runs on old and new distributions alike.
      - name: Build release binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo zigbuild --release --locked -p mrt-app --target ${{ matrix.target }}.2.17

      - name: Build release binary
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package binary (Windows)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="latest"
          ARCHIVE_NAME="mrt-${TAG_NAME}-${{ matrix.target }}.zip"
          cd target/${{ matrix.target }}/release
          7z a "../../../${ARCHIVE_NAME}" "${{ matrix.bin_name }}"
          cd ../../..
          echo "ASSET_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Package binary (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="latest"
          ARCHIVE_NAME="mrt-${TAG_NAME}-${{ matrix.target }}.tar.gz"
          cd target/${{ matrix.target }}/release
          tar -czf "../../../${ARCHIVE_NAME}" "${{ matrix.bin_name }}"
          cd ../../..
          echo "ASSET_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
