# Modern Rust Terminal (MRT) configuration example
# 100% Free for All — No Restrictions.
#
# Copy this file to one of these places (every setting is optional):
#   Linux/macOS: ~/.config/mrt/config.toml   ($XDG_CONFIG_HOME/mrt/config.toml if set)
#   Windows:     %APPDATA%\mrt\config.toml
#   Anywhere:    point the MRT_CONFIG environment variable at the file
# A `.mrt.toml` in the folder you start MRT from is merged on top (project settings win).
# MRT reloads both files when they change. If a file has a syntax error, MRT keeps the
# last good settings and shows the error at the top of the window.

[terminal]
default_shell = "auto" # "auto", "pwsh", "powershell", "cmd", "bash", "git-bash", "wsl", "zsh", "fish", "nu", "sh"
font_size = 14.0       # terminal (monospace) font size, 8–40
# font_family = "JetBrains Mono"          # a family name installed here, or a .ttf/.otf/.ttc path
# font_fallback = ["Symbols Nerd Font"]   # tried in order for characters the main font lacks
# theme = "graphite-calm" # "graphite-calm" (aliases "dark", "default"), "high-contrast", or a theme
#                         # file: a path, or a name next to this file or in its themes/ folder.
#                         # MRT TOML, Windows Terminal JSON, Alacritty, Ghostty and iTerm2 themes work.
persistent_shell = true              # one shell per tab: cd, variables and venvs carry over
session_server = true                # shells, commands and programs live in `mrt session-host`,
                                     # so they survive the window closing or crashing
keep_running_on_close = true         # closing the window with work running keeps MRT in the background
restore_layout = true                # reopen tabs, splits, shells and folders at the next start
max_block_output_mb = 32             # output kept per command block (0 = everything, max 4096)
quick_dropdown = false               # `mrt quick` shows the window across the top of the screen
quick_height_percent = 45            # height of that drop-down, 20–100
fast_native_output = false           # Windows: plain native programs typed in PowerShell run via cmd.exe
scrollback_blocks = 500              # reserved, not applied yet
auto_detect_structured_output = true # reserved, not applied yet

[safety]
enabled = true                       # false: never ask (blocked_patterns still apply)
require_approval_for_moderate = false # true: also ask before every Moderate command
require_approval_for_critical = true
remote_approvals = false             # let the phone companion (mrt share --web) answer the Safety Gate
# Commands containing any of these (case-insensitive) are refused, never run.
# A project .mrt.toml adds to this list; it cannot remove entries.
blocked_patterns = [
    "rm -rf /",
    "format c:",
]

[ai]
# API keys are read from environment variables only — never put them in this file:
# - GEMINI_API_KEY       (Google Gemini)
# - ANTHROPIC_API_KEY    (Anthropic Claude)
# - OPENAI_API_KEY       (OpenAI)
# - XAI_API_KEY          (xAI Grok)
# - DEEPSEEK_API_KEY     (DeepSeek)
# - OPENROUTER_API_KEY   (OpenRouter — access 200+ models)
# - OLLAMA_MODEL         (Local free models via Ollama, e.g., "qwen2.5-coder" or "llama3.2")
# provider: "auto" tries every configured provider in the order above; naming one
# ("gemini", "anthropic", "openai", "xai", "deepseek", "openrouter", "ollama") tries it
# first; "offline" always uses the built-in heuristic engine.
provider = "auto"
# model = "gpt-4o-mini"   # model for the chosen provider (OLLAMA_MODEL wins for Ollama)
ollama_endpoint = "http://localhost:11434" # OLLAMA_HOST wins if set

# MCP servers to connect at startup (stdio transport). A project .mrt.toml entry with
# the same name replaces the user entry.
[[mcp.servers]]
name = "filesystem"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
enabled = false

[[mcp.servers]]
name = "mrt-loopback"
transport = "stdio"
command = "mrt"
args = ["--mcp-server"]
enabled = false # MRT's own tools are already built in; enable to test an external MRT process

# Notify when a command that ran at least threshold_secs finishes.
[notifications]
enabled = true
threshold_secs = 10

# Keyboard shortcuts: "binding" = "action name". Applied live; problems are listed in
# the Command Palette. See the User Guide, "Custom keybindings".
[keybindings]
# "ctrl+t" = "new_tab"
# "ctrl+a > c" = "new_tab"        # chain: Ctrl+A, then C
# "ctrl+b" = "enter_table:pane"   # key table (mode)
# "pane/h" = "split_horizontal"
# "ctrl+alt+t" = "run:tests"      # an [[actions]] entry

# Your own actions: they appear in the Command Palette and can have a key.
# Several lines run in order like a runbook; MRT commands (":split-h") work too.
# [[actions]]
# name = "tests"
# title = "Run the test suite"
# command = "cargo test --workspace"
# key = "ctrl+alt+t"

# Commands MRT runs in the background when something happens. Events:
# command_finished, command_failed, cwd_changed, tab_opened. The environment has
# MRT_EVENT, MRT_COMMAND, MRT_EXIT_CODE, MRT_DURATION_MS, MRT_CWD and MRT_TAB.
# [[hooks]]
# event = "command_failed"
# match = "cargo"
# min_duration_secs = 30
# run = "notify-send MRT \"$MRT_COMMAND failed\""
